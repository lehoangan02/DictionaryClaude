[workspace]
resolver = "2"
members = ["crates/core", "crates/packer", "crates/app", "crates/server", "crates/syncd"]

# The desktop/mobile shell needs system webview libraries, so it builds on its own.
exclude = ["app/src-tauri"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
zstd = "0.13"
quick-xml = "0.37"
uuid = { version = "1", features = ["v4"] }
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
rcgen = "0.13"
sha2 = "0.10"
base64 = "0.22"
ureq = { version = "3", default-features = false, features = ["rustls"] }
