[package]
name = "ladybird"
version = "0.6.0"
edition = "2021"
description = "LadyBird: an offline GRE dictionary"

# Its own workspace: the system webview libraries are only needed here.
[workspace]

[lib]
name = "ladybird_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
gredict-app = { path = "../../crates/app" }
anyhow = "1"
# Native playback: the window's web engine cannot play audio inside an AppImage.
serde_json = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
rodio = { version = "0.20", default-features = false, features = ["symphonia-mp3", "symphonia-vorbis"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true
panic = "abort"
